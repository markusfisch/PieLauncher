apply plugin: 'com.android.application'

android {
	testOptions {
		unitTests.all { testLogging { showStandardStreams = true } }
		unitTests {
			includeAndroidResources = true
		}
	}

	namespace 'de.markusfisch.android.pielauncher'
	compileSdk sdk_version

	buildFeatures {
		buildConfig true
	}

	defaultConfig {
		minSdk 9
		targetSdk sdk_version

		versionCode 75
		versionName '1.28.0'
	}

	signingConfigs {
		release {
			keyAlias System.getenv('ANDROID_KEY_ALIAS')
			keyPassword System.getenv('ANDROID_KEY_PASSWORD')
			storePassword System.getenv('ANDROID_STORE_PASSWORD')
			def filePath = System.getenv('ANDROID_KEYFILE')
			storeFile filePath ? file(filePath) : null
		}
	}

	buildTypes {
		debug {
			applicationIdSuffix '.debug'
		}

		release {
			minifyEnabled true
			shrinkResources true
			signingConfig signingConfigs.release
		}
	}

	packaging {
		resources {
			excludes += 'kotlin/**'
		}
	}
}

androidComponents {
	onVariants(selector().all()) { variant ->
		variant.outputs.each { output ->
			output.outputFileName.set(output.versionName.map { name -> "pie_launcher_${name}.apk"
			})
		}
	}
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.robolectric:robolectric:4.12.1'
	testImplementation 'org.mockito:mockito-core:5.12.0'
	testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.40.1'
	testImplementation 'io.github.takahirom.roborazzi:roborazzi-junit-rule:1.40.1'
}
